# ========================================
# Nginx 反向代理配置
# ========================================
# 
# 使用方法：
# 1. 安装 Nginx: sudo apt-get install nginx
# 2. 复制此文件到: /etc/nginx/sites-available/miniprogram-backend
# 3. 创建软链接: sudo ln -s /etc/nginx/sites-available/miniprogram-backend /etc/nginx/sites-enabled/
# 4. 测试配置: sudo nginx -t
# 5. 重启 Nginx: sudo systemctl restart nginx
# ========================================

server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名或服务器IP
    
    # 日志配置
    access_log /var/log/nginx/miniprogram-backend-access.log;
    error_log /var/log/nginx/miniprogram-backend-error.log;
    
    # 客户端最大上传大小
    client_max_body_size 10M;
    
    # 反向代理到 Spring Boot 应用
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://localhost:8080;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

